# Exemplo de Configuração Nginx para VPS (reserva.roxou.com.br)
# Arquivo: /nginx.example.conf

server {
    listen 80;
    listen [::]:80;
    
    server_name reserva.roxou.com.br;

    # Redirecionamento automático HTTP para HTTPS (Recomendado)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name reserva.roxou.com.br;

    # Caminho absoluto para a pasta de arquivos compilados (dist/) no seu servidor VPS
    root /var/www/reserva-roxou/dist;
    index index.html;

    # Certificados SSL Let's Encrypt (Configurar via Certbot)
    # ssl_certificate /etc/letsencrypt/live/reserva.roxou.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/reserva.roxou.com.br/privkey.pem;

    # Cabeçalhos de Segurança de Alta Proteção (Production Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://accounts.google.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://*.gstatic.com; img-src 'self' data: https: https://*.googleusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com https://*.googleapis.com;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Otimização de segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Configurações de gzip para compactação de arquivos estáticos
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Roteamento centralizado do Single Page Application (React / Router)
    # Evita erros de 404 ao atualizar rotas como /solicitar ou /admin diretamente no navegador
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Control para Assets Estáticos do build do Vite (Vantajoso para performance)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Logs de Acesso e Erros
    access_log /var/log/nginx/reserva_roxou_access.log;
    error_log /var/log/nginx/reserva_roxou_error.log;
}
